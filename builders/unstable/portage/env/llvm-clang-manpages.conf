# The LLVM 23 manpage tarball ships clang's pages in its llvm directory, so
# llvm collides with clang on merge (bug 984675). clang still installs them.
# INSTALL_MASK covers the merge, PKG_INSTALL_MASK the published binary package.
INSTALL_MASK="
	/usr/lib/llvm/23/share/man/man1/clang.1*
	/usr/lib/llvm/23/share/man/man1/diagtool.1*
	/usr/lib/llvm/23/share/man/man1/extraclangtools.1*
	/usr/lib/llvm/23/share/man/man1/scan-build.1*
"
PKG_INSTALL_MASK="${INSTALL_MASK}"
