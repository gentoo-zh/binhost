# openwrt.daeuniverse.org: the daeuniverse OpenWrt package feeds (dae, honk,
# vmlinux-btf). Their CI uploads over rrsync as the daeuniverse account into
# /srv/daeuniverse/openwrt: the packages to feed/, the guide pages to site/.
# The packages and indexes are signed, so plain HTTP is served as well, as on
# distfiles.

# / sends a reader to the guide in the first Accept-Language tag's language.
map $http_accept_language $ow_lang {
	default en;
	"~*^zh-(tw|hk|mo|hant)" zh-tw;
	"~*^zh" zh-cn;
}

server {
	listen 80;
	listen [::]:80;
	server_name openwrt.daeuniverse.org;

	include /etc/nginx/conf.d/openwrt-daeuniverse.inc;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	listen 443 quic;
	listen [::]:443 quic;
	server_name openwrt.daeuniverse.org;

	ssl_certificate     /etc/letsencrypt/live/openwrt.daeuniverse.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/openwrt.daeuniverse.org/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	include /etc/nginx/conf.d/openwrt-daeuniverse.inc;
}
