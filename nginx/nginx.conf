user nginx nginx;
worker_processes auto;
include modules-enabled/*.conf;

events {
	worker_connections 2048;
}

http {
	types_hash_max_size 4096;
	include mime.types.nginx;
	# distfile 的后缀五花八门，mime.types 收不全：.crate、.whl、.vsix、
	# .AppImage 都不在里面。没有这一行时 nginx 内建的默认是 text/plain，于是
	# 它们带上 charset=utf-8，还落进下面 gzip_types 的 text/plain 被压一遍
	# ——这台一个核，rsyncd.conf 那边正为此列了一长串 dont compress。
	default_type application/octet-stream;
	charset utf-8;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 30;
	server_tokens off;

	# 这台机器的负载几乎全是「重复读同一批不变的文件」，
	# 缓存文件描述符省掉大量 open/stat。
	open_file_cache max=4096 inactive=60s;
	open_file_cache_valid 120s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;

	# 二进制包已压缩过，只压索引和 JSON
	gzip on;
	gzip_types text/plain application/json;
	gzip_min_length 1024;

	# 限流。portage 会并发抓取 binpkg，并发数不能设得过低。
	limit_conn_zone $binary_remote_addr zone=perip:10m;
	limit_req_zone $binary_remote_addr zone=reqs:10m rate=50r/s;

	# 记 Host：迁移期间要看清还有多少客户端在用旧域名，不记就只能猜。
	# $time_local 必须有：轮转之后没有它，任何一行都无法定位到时间，只能拿
	# 网卡计数去推。$scheme 用来分辨 HTTP 与 HTTPS——distfiles.conf 两边都
	# 提供完整内容，日志里不写就分不出来。
	log_format mirror '$remote_addr $host [$time_local] $scheme $status $body_bytes_sent "$request" "$http_user_agent"';

	include /etc/nginx/conf.d/*.conf;
}
