user nginx nginx;
worker_processes auto;
include modules-enabled/*.conf;

events {
	worker_connections 2048;
}

http {
	types_hash_max_size 4096;
	include mime.types.nginx;
	# distfile 的后缀 mime.types 收不全：.crate、.whl、.vsix、.AppImage 都不在
	# 里面，落到内建默认的 text/plain 会带上 charset 并被 gzip 压一遍，而这台
	# 一个核。所以给它们补上类型，而不是改全局默认——Packages 索引没有后缀，
	# 走的也是全局默认，把它改成 octet-stream 就等于把索引的压缩关掉：实测
	# 184 KB 的索引从「已压缩」变「未压缩」，而那是每个用户每次同步都要下的。
	# deb、rpm、apk、zst 不在这里：mime.types 已经给了它们各自的类型，重复
	# 声明 nginx 会在启动时报 duplicate extension，而那些类型本来就不在
	# gzip_types 里，加进来不改变任何行为。
	types {
		application/octet-stream  crate whl vsix AppImage;
	}
	charset utf-8;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 30;
	server_tokens off;

	# 这台机器的负载几乎全是「重复读同一批不变的文件」，
	# 缓存文件描述符省掉大量 open/stat。
	open_file_cache max=4096 inactive=60s;
	open_file_cache_valid 120s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;

	# 二进制包已压缩过，只压索引和 JSON
	gzip on;
	# text/html 无论列不列都会压。css 与 js 漏了，站点的样式和脚本一直是
	# 未压缩下发的：27 KB 的 css 加 18 KB 的 js，每个新访客都要全量下。
	gzip_types text/plain text/css text/javascript application/json;
	gzip_min_length 1024;

	# 限流。portage 会并发抓取 binpkg，并发数不能设得过低。
	limit_conn_zone $binary_remote_addr zone=perip:10m;
	limit_req_zone $binary_remote_addr zone=reqs:10m rate=50r/s;

	# 记 Host：迁移期间要看清还有多少客户端在用旧域名，不记就只能猜。
	# $time_local 必须有：轮转之后没有它，任何一行都无法定位到时间，只能拿
	# 网卡计数去推。$scheme 用来分辨 HTTP 与 HTTPS——distfiles.conf 两边都
	# 提供完整内容，日志里不写就分不出来。
	log_format mirror '$remote_addr $host [$time_local] $scheme $status $body_bytes_sent "$request" "$http_user_agent"';

	include /etc/nginx/conf.d/*.conf;
}
