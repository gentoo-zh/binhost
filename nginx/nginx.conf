user nginx nginx;
worker_processes auto;
include modules-enabled/*.conf;

events {
	worker_connections 2048;
}

http {
	types_hash_max_size 4096;
	include mime.types.nginx;
	types {
		application/octet-stream  crate whl vsix AppImage nupkg provenance;
		application/x-tar         tar;
	}
	charset utf-8;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 30;
	server_tokens off;

	open_file_cache max=4096 inactive=60s;
	open_file_cache_valid 120s;
	open_file_cache_min_uses 2;
	open_file_cache_errors on;

	gzip on;
	gzip_types text/plain text/css text/javascript application/javascript application/json;
	gzip_min_length 1024;
	gzip_vary on;

	limit_conn_zone $binary_remote_addr zone=perip:10m;
	limit_req_zone $binary_remote_addr zone=reqs:10m rate=50r/s;

	log_format mirror '$remote_addr $host [$time_local] $scheme $status $body_bytes_sent "$request" "$http_user_agent"';

	include /etc/nginx/conf.d/*.conf;
}
