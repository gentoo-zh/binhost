# Pages on gentoozh.org and its subdomains read the package indexes; any other origin gets no
# Access-Control-Allow-Origin header (nginx omits a header whose value is empty).
map $http_origin $gz_cors_origin {
	default "";
	"~^https://([a-z0-9-]+\.)*gentoozh\.org$" $http_origin;
}

# A directory URL answers in one of three forms. Text browsers and Wget get the
# stock autoindex page, which wget -r and link following understand; a browser
# (Accept naming text/html) is sent to the file browser on gentoozh.org;
# anything else, such as curl, HTTPie or a script sending */*, gets one
# plain-text line per entry.
map $http_user_agent $gz_ua {
	default "";
	"~*^(w3m|lynx|links|elinks|wget|dillo|netsurf)" html;
}
map "$gz_ua|$http_accept" $gz_listing {
	default txt;
	"~^html\|" html;
	"~^\|.*text/html" web;
}
# Redirects to gentoozh.org keep the reader's language: ?lang= first, then the
# first Accept-Language tag, then zh-cn, which has no path prefix.
map $arg_lang $gz_lang_q {
	default "-";
	zh-cn "";
	zh-tw /zh-tw;
	en /en;
}
map $http_accept_language $gz_lang_al {
	default "";
	"~*^en" /en;
	"~*^zh-(tw|hk|mo|hant)" /zh-tw;
}
map $gz_lang_q $gz_prefix {
	"-" $gz_lang_al;
	default $gz_lang_q;
}
# The request path as the client sent it, still percent-encoded, and the same
# path without the virtual /files prefix.
map $request_uri $gz_path {
	"~^(?<p>[^?]*)" $p;
}
map $gz_path $gz_path_rel {
	"~^/files(?<r>/.*)$" $r;
	default $gz_path;
}
map $gz_path $gz_raw_rel {
	"~^/_raw(?<r>/.*)$" $r;
	default /;
}


server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name distfiles.gentoozh.org;

	include /etc/nginx/conf.d/mirror-common.inc;
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	http2 on;
	listen 443 quic reuseport;
	listen [::]:443 quic reuseport;
	server_name distfiles.gentoozh.org;

	ssl_certificate     /etc/letsencrypt/live/distfiles.gentoozh.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/distfiles.gentoozh.org/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	include /etc/nginx/conf.d/headers-site.inc;

	include /etc/nginx/conf.d/mirror-common.inc;
}
