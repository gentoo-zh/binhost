# HTTP 和 HTTPS 都提供完整内容，不做强制跳转。
# 镜像站的客户端是包管理器不是浏览器，二进制包本身有 GPG 签名，
# 传输层不是信任边界；强制 HTTPS 只会让 CA 库过期的老机器彻底装不上。

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name mirrors.gentoozh.org;

	include /etc/nginx/conf.d/mirror-common.inc;
}

server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	http2 on;
	server_name mirrors.gentoozh.org;

	ssl_certificate     /etc/letsencrypt/live/mirrors.gentoozh.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/mirrors.gentoozh.org/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# 不开 ssl_stapling：Let's Encrypt 已经停掉 OCSP 响应器，
	# 配了只会让每次握手多一次注定失败的查询。

	# 只约束浏览器。portage/wget 不实现 HSTS，配了它们的 http:// 配置照常能用。
	# 不加 preload：进入预加载列表容易，退出困难。
	add_header Strict-Transport-Security "max-age=31536000" always;

	include /etc/nginx/conf.d/mirror-common.inc;
}
