<script>


function t(key) { return (window.MIRROR_T && window.MIRROR_T(key)) || key; }


function splitCPV(cpv) {
  const parts = cpv.split("-");
  for (let i = 1; i < parts.length; i++) {
    if (/^[0-9]/.test(parts[i])) {
      return [parts.slice(0, i).join("-"), parts.slice(i).join("-")];
    }
  }
  return [cpv, ""];
}

function cmpVer(a, b) {
  const pa = String(a).split(/[-.]/), pb = String(b).split(/[-.]/);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] === undefined ? "" : pa[i], y = pb[i] === undefined ? "" : pb[i];
    const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
    if (nx && ny) { if (+x !== +y) return +x - +y; }
    else if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}

function parsePackages(text) {
  const built = {};
  text.split("\n\n").slice(1).forEach(function (stanza) {
    const cpv = /^CPV: (.+)$/m.exec(stanza);
    if (!cpv) return;
    const size = /^SIZE: (\d+)$/m.exec(stanza);
    const [cp, ver] = splitCPV(cpv[1].trim());
    if (!built[cp] || cmpVer(ver, built[cp].ver) > 0) {
      built[cp] = { ver: ver, size: size ? +size[1] : 0 };
    }
  });
  return built;
}

let rows = [];
let filter = "all";
let distGenerated = 0, binGenerated = 0;
let binFailed = false;
let distFailed = false;

function fmtTime(unix) {
  const n = Number(unix);
  if (!n) return "";
  return new Date((n + 8 * 3600) * 1000)
    .toISOString().slice(0, 16).replace("T", " ") + " UTC+8";
}

function mark(text, q) {
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) +
         '</mark>' + esc(text.slice(i + q.length));
}

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  let hit = rows;
  if (filter === "bin") hit = hit.filter(function (r) { return r.ver; });
  else if (filter === "dist") hit = hit.filter(function (r) { return r.dist; });
  if (q) hit = hit.filter(function (r) {
    return r.cp.toLowerCase().indexOf(q) >= 0 || r.desc.toLowerCase().indexOf(q) >= 0;
  });

  const out = document.getElementById("out");
  const msg = document.getElementById("msg");
  const table = out.querySelector(".listing");
  if (!hit.length) {
    table.hidden = true;
    msg.hidden = false;
    msg.textContent = t("none");
    return;
  }

  table.hidden = false;
  msg.hidden = true;
  document.getElementById("rows").innerHTML =
    hit.map(function (r) {
      const url = "https://github.com/gentoo-zh/overlay/tree/master/" + r.cp;
      return '<tr>' +
        '<td class="name"><a href="' + esc(url) + '">' + esc(r.cp).replace("/", "/<wbr>") + '</a>' +
          (q && r.cp.toLowerCase().indexOf(q) < 0
            ? '<span class="hit-desc">' + mark(r.desc, q) + '</span>' : '') +
        '</td>' +
        '<td class="desc" title="' +
          esc(r.desc + (r.excluded ? "　" + r.excluded : "")) + '">' +
          esc(r.desc) +
          (r.excluded ? ' <span class="why">· ' + esc(r.excluded) + '</span>' : '') +
        '</td>' +
        '<td class="mark ' + (r.ver ? 'yes' : 'no') + '"' +
          (r.excluded ? ' title="' + esc(r.excluded) + '"' : '') + '>' +
          (r.ver ? '\u2713'
                 : r.excluded ? '<span class="pend">' + t("excluded") + '</span>'
                 : r.binhost ? '<span class="pend">' + t("pending") + '</span>'
                 : r.why ? '<span class="pend why-tag" title="' + esc(t("whyLong_" + r.why)) + '">' +
                             t("why_" + r.why) + '</span>'
                 : '\u2014') + '</td>' +
        '<td class="mark ' + (r.dist ? 'yes' : 'no') + '">' + (r.dist ? '\u2713' : '\u2014') + '</td>' +
        '<td class="ver">' + r.ver + '</td>' +
        '<td class="size">' + human(r.size) + '</td></tr>';
    }).join("");
}

function counts() {
  const b = rows.filter(function (r) { return r.ver; }).length;
  const d = rows.filter(function (r) { return r.dist; }).length;
  document.getElementById("count").textContent = t("countFmt")
    .replace("{n}", rows.length)
    .replace("{b}", binFailed ? t("unknown") : b)
    .replace("{d}", distFailed ? t("unknown") : d);

  const u = [];
  if (binGenerated) u.push(t("updBin") + fmtTime(binGenerated));
  if (distGenerated) u.push(t("updDist") + fmtTime(distGenerated));
  document.getElementById("updated").textContent = u.join("\n");

}

function markFilter() {
  document.querySelectorAll("#filters .filter").forEach(function (b) {
    b.classList.toggle("on", b.dataset.f === filter);
  });
}

Promise.all([
  fetch("/packages.json").then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }),
  fetch("/binpkgs/x86-64/Packages")
    .then(function (r) { return r.ok ? r.text() : null; })
    .catch(function () { return null; }),
  fetch("/distfiles-index.json")
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; })
]).then(function (res) {
  binFailed = res[1] === null;
  distFailed = res[2] === null;
  const built = parsePackages(res[1] || "");
  const have = new Set((res[2] || {}).files || []);
  distGenerated = (res[2] || {}).generated || 0;
  binGenerated = (/^TIMESTAMP: (\d+)/m.exec(res[1] || "") || [])[1] || 0;
  rows = res[0].packages.map(function (p) {
    const b = built[p.cp] || {};
    const dist = p.dist && p.dist.length > 0 && p.dist.every(function (f) { return have.has(f); });
    return { cp: p.cp, desc: p.desc, binhost: p.binhost, excluded: p.excluded || "",
             why: p.why || "", ver: b.ver || "", size: b.size || 0, dist: dist };
  });
  counts();
  render();
}).catch(function (e) {
  document.getElementById("out").textContent = t("failed") + e;
});

document.getElementById("q").addEventListener("input", render);
document.getElementById("msg").textContent = t("loading");
document.getElementById("filters").addEventListener("click", function (e) {
  const b = e.target.closest("button[data-f]");
  if (!b) return;
  filter = b.dataset.f;
  markFilter();
  counts(); render();
});

document.addEventListener('langchange', function () {
  if (rows.length) { counts(); render(); }
});
</script>
