    notFound: '這個路徑不存在。', failed: '讀取目錄失敗：',

  },
  'en': { loading: 'Loading…',
    title: 'Files', thWhat: 'Content',
    thName: 'Name', thSize: 'Size', thDate: 'Modified',

<script src="/assets/i18n.js?v=7deb9357"></script>

<script>

if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/");

let path;
try {
  path = decodeURIComponent(location.pathname);
} catch (e) {
  path = location.pathname;
}

const ROOT = "/files/";

const ROOT_DESC = {
  'binpkgs': { 'zh-cn': '二进制包', 'zh-tw': '二進位套件', 'en': 'Binary packages' },
  'distfiles': { 'zh-cn': '软件包源码', 'zh-tw': '套件原始碼', 'en': 'Package sources' }
};
const atRoot = path === ROOT;
const lsPath = atRoot ? "/" : path;



function t(key) { return (window.MIRROR_T && window.MIRROR_T(key)) || key; }


function lang() {
  return document.documentElement.lang || 'zh-cn';
}

function crumbs() {
  document.getElementById("where").textContent =
    atRoot ? t("title") : path.replace(/\/$/, "");

  const crumbEl = document.getElementById("crumbs");
  crumbEl.hidden = atRoot;
  if (atRoot) return;

  let acc = "";
  const links = path.split("/").filter(Boolean).map(function (p) {
    acc += "/" + encodeURIComponent(p);
    return '<a href="' + acc + '/">' + esc(p) + "</a>";
  });
  document.getElementById("crumbs").innerHTML =
    ['<a href="' + ROOT + '">' + t("navFiles") + "</a>"].concat(links).join(" / ");
}

function fixHead() {
  if (!atRoot) return;
  document.getElementById("hd").innerHTML =
    '<th data-i18n="thName">' + esc(t("thName")) + '</th>' +
    '<th data-i18n="thWhat">' + esc(t("thWhat")) + '</th>';
}

function render(items) {
  items.sort(function (a, b) {
    if (a.type === b.type) return a.name.localeCompare(b.name);
    return a.type === "directory" ? -1 : 1;
  });

  const up = (path === "/" || atRoot) ? "" :
    '<tr><td class="name"><a href="../">../</a></td><td class="size"></td><td class="date"></td></tr>';

  const rows = items.map(function (it) {
    const isDir = it.type === "directory";
    const href = (atRoot ? "/" : "") + encodeURIComponent(it.name) + (isDir ? "/" : "");
    const date = it.mtime
      ? new Date(new Date(it.mtime).getTime() + 8 * 3600 * 1000)
          .toISOString().slice(0, 16).replace("T", " ")
      : "";
    const d = ROOT_DESC[it.name];
    return '<tr>' +
      '<td class="name"><a class="' + (isDir ? "dir" : "") + '" href="' + href + '">' + esc(it.name) + '</a></td>' +
      (atRoot ? '<td class="desc">' + (d ? esc(d[lang()] || d['zh-cn']) : '') + '</td>'
              : '<td class="size">' + (isDir ? "" : human(it.size)) + '</td>') +
      (atRoot ? '' : '<td class="date">' + date + '</td>') + '</tr>';
  }).join("");

  document.getElementById("rows").innerHTML = up + rows;
  document.getElementById("msg").hidden = true;
  document.querySelector("#out .listing").hidden = false;
}

function fail(e) {
  document.querySelector("#out .listing").hidden = true;
  const m = document.getElementById("msg");
  m.hidden = false;
  m.textContent = e === 404 ? t("notFound") : t("failed") + e;
}

let loaded = null;

crumbs();
fixHead();
document.getElementById("msg").textContent = t("loading");
fetch("/_ls" + lsPath)
  .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
  .then(function (items) { loaded = items; render(items); })
  .catch(function (e) { loaded = e; fail(e); });

document.addEventListener('langchange', function () {
  fixHead();
  crumbs();
  if (Array.isArray(loaded)) render(loaded);
  else if (loaded !== null) fail(loaded);
});
</script>
