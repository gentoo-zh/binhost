<!-- 表格是 JS 生成的，但它的文案照样要能翻译。放在这里让 i18n.js 按常规流程处理，
     渲染时再读回来——省得在脚本里复制一份语言判定逻辑。 -->
<div id="strings" hidden>
  <span data-i18n="title">文件</span>
  <span data-i18n="thWhat">内容</span>
  <span data-i18n="thName">名称</span>

  <!-- 面包屑的第一节要用它。t() 只从这里取，导航栏上那一个它读不到。 -->
  <span data-i18n="navFiles">文件</span>
</div>

<script>
window.MIRROR_I18N = {
  'zh-tw': { loading: '載入中…',
    title: '檔案', thWhat: '內容',
    thName: '名稱', thSize: '大小', thDate: '修改時間',
    notFound: '這個路徑不存在。', failed: '讀取目錄失敗：'
  },
  'en': { loading: 'Loading…',
    title: 'Files', thWhat: 'Content',
    thName: 'Name', thSize: 'Size', thDate: 'Modified',
    notFound: 'No such path.', failed: 'Could not read directory: '
  }
};
</script>
<script src="/assets/i18n.js"></script>

<script>
// nginx 在 /_ls/ 下用 autoindex_format json 输出目录内容，这个页面只管渲染。
// 文件本身由 nginx 直接发，不经过这里——portage 和 wget 拿到的路径跟 JS 无关。

// 因为缺少结尾斜杠时页内相对链接会解析到上一级，所以先补齐再渲染。
if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/");

const path = decodeURIComponent(location.pathname);

// /files/ 是浏览入口，它对应的是被镜像内容的根。下面各项的真实地址是
// /binpkgs/、/distfiles/ 这些，所以从这里出去的链接要写成绝对路径。
const ROOT = "/files/";

// 根层列的是两类内容，光看目录名不知道是什么。深层就是普通的目录列表，
// 不需要说明。
const ROOT_DESC = {
  'binpkgs': { 'zh-cn': '二进制包', 'zh-tw': '二進位套件', 'en': 'Binary packages' },
  'distfiles': { 'zh-cn': '软件包源码', 'zh-tw': '套件原始碼', 'en': 'Package sources' }
};
const atRoot = path === ROOT;
const lsPath = atRoot ? "/" : path;

// 路径和文件名都进 innerHTML。路径来自 URL，任何以斜杠结尾的地址 nginx 都
// 回这个页面；文件名来自 ebuild 的 Manifest。两者都不是我们能约束的内容。


// i18n.js 已经把当前语言的串换进 #strings 了，直接读。
function t(key) {
  const el = document.querySelector('#strings [data-i18n="' + key + '"]');
  return el ? el.textContent : key;
}


function lang() {
  return document.documentElement.lang || 'zh-cn';
}

function crumbs() {
  // 标题写当前位置，和多数镜像站一样。根层没有路径可写，用页面名。
  document.getElementById("where").textContent =
    atRoot ? t("title") : path.replace(/\/$/, "");

  // 根层标题已经写明位置，再放一个只有「mirrors」的面包屑是多余的
  const crumbEl = document.getElementById("crumbs");
  crumbEl.hidden = atRoot;
  if (atRoot) return;

  // 按整个路径切。深层地址是 /binpkgs/、/distfiles/，不在 ROOT 底下，
  // 按 ROOT 的长度切会把 "/binpkgs/" 切成 "s"。
  let acc = "";
  const links = path.split("/").filter(Boolean).map(function (p) {
    acc += "/" + p;
    return '<a href="' + encodeURI(acc) + '/">' + esc(p) + "</a>";
  });
  // 第一节回文件浏览器的根，不是站点首页——原来它连到 /，点下去就离开了这个
  // 页面。名字用导航里已有的那一个，全站叫法一致；原来写死的 mirrors 在别处
  // 从未出现过，也没有翻译。
  // atRoot 那个三元是死码：上面已经在 atRoot 时提前返回了。
  document.getElementById("crumbs").innerHTML =
    ['<a href="' + ROOT + '">' + t("navFiles") + "</a>"].concat(links).join(" / ");
}

function render(items) {
  // 目录排在前面，同类按名字排。浏览深层目录时不必在文件列表中查找子目录。
  items.sort(function (a, b) {
    if (a.type === b.type) return a.name.localeCompare(b.name);
    return a.type === "directory" ? -1 : 1;
  });

  // 写成 ../ 而不是 ..：两个点落在基线上，加下划线后看着像被截掉了半行
  const up = (path === "/" || atRoot) ? "" :
    '<tr><td class="name"><a href="../">../</a></td><td class="size"></td><td class="date"></td></tr>';

  const rows = items.map(function (it) {
    const isDir = it.type === "directory";
    const href = (atRoot ? "/" : "") + encodeURIComponent(it.name) + (isDir ? "/" : "");
    // 服务端 autoindex 输出的是 GMT，转成 UTC+8 显示
    const date = it.mtime
      ? new Date(new Date(it.mtime).getTime() + 8 * 3600 * 1000)
          .toISOString().slice(0, 16).replace("T", " ")
      : "";
    const d = ROOT_DESC[it.name];
    return '<tr>' +
      '<td class="name"><a class="' + (isDir ? "dir" : "") + '" href="' + href + '">' + esc(it.name) + '</a></td>' +
      (atRoot ? '<td class="desc">' + (d ? esc(d[lang()] || d['zh-cn']) : '') + '</td>'
              : '<td class="size">' + (isDir ? "" : human(it.size)) + '</td>') +
      (atRoot ? '' : '<td class="date">' + date + '</td>') + '</tr>';
  }).join("");

  const out = document.getElementById("out");
  out.className = "";
  out.innerHTML =
    '<table class="listing"><thead><tr>' +
      '<th>' + t("thName") + '</th>' +
      (atRoot ? '<th>' + t("thWhat") + '</th>'
              : '<th class="size">' + t("thSize") + '</th>' +
                '<th class="date">' + t("thDate") + '</th>') +
    '</tr></thead><tbody>' + up + rows + '</tbody></table>';
}

function fail(e) {
  const out = document.getElementById("out");
  out.className = "msg";
  out.textContent = e === 404 ? t("notFound") : t("failed") + e;
}

let loaded = null;   // 留一份，切语言时要用它重绘

crumbs();
fetch("/_ls" + lsPath)
  .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
  .then(function (items) { loaded = items; render(items); })
  .catch(function (e) { loaded = e; fail(e); });

// 切语言时 i18n.js 会改写 #strings，表格是我们自己画的，得跟着重画一次。
new MutationObserver(function () {
  // 面包屑与标题也要重画。它们原来只在载入时算一次，于是把标签换成可翻译的
  // 之后，切语言时那一节仍停在首屏那种语言——写死 mirrors 的时候看不出来。
  crumbs();
  if (Array.isArray(loaded)) render(loaded);
  else if (loaded !== null) fail(loaded);
}).observe(document.getElementById("strings"), { subtree: true, characterData: true, childList: true });
</script>
