#!/sbin/nft -f
#
# 镜像机的防火墙。deploy/install.sh 把 __SSH_PORT__ 换成实际端口，装到
# /etc/nftables.conf 并应用。端口原本写死 60001，而 provision.sh 用的是
# SSH_PORT 变量，改过端口的机器装完这份就再也连不进去。
#
# OpenRC 的 nftables 服务从 /var/lib/nftables/rules-save 还原，那是运行时
# 状态不是配置：SAVE_ON_STOP=yes 会在停服务时用当前规则覆盖它。改规则要改
# 这份文件，应用之后 rc-service nftables save 存回去，否则重启就回到旧的。

flush ruleset

table inet filter {
	# node_exporter 的抓取源，不入库。本文件带 flush ruleset 会清空本集合，
	# 故由 install.sh 据 MONITORS 重填并存盘。集合为空时 9100 不放行任何来源。
	set monitor_hosts {
		type ipv4_addr
	}

	# ssh 的洪泛计数，按来源地址分别记。原来那条 limit rate 是一条规则一个
	# 令牌桶，没有来源维度：任何扫描器对这个端口打 10 SYN/分就能把桶抽空，
	# 之后管理员自己的新连接落到 policy drop。被 drop 的 SYN 重传仍然算
	# ct state new，所以自己的重试也在烧令牌。这台是 policy drop、没有
	# console，锁出去就没了。
	set ssh_flood {
		type ipv4_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}

	# 同一份规则的 IPv6 那一半。inet 表里 ip saddr 隐含 meta nfproto ipv4，
	# 所以只写一条时 IPv6 的包整条不匹配、直接落到下面的 accept——改动前那条
	# limit rate 没有任何 family 相依，v4 v6 都限，这台又是双栈。
	set ssh_flood6 {
		type ipv6_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}

	# rsync 的并发数同样按来源记。全局计数挡不住滥用者，只挡得住其他人：
	# 单个客户端开满就把所有下游镜像站关在门外。
	# ct count 的集合不能带 timeout，nft 会拒绝：连接数由 connlimit 自己回收。
	set rsync_conns {
		type ipv4_addr
		flags dynamic
		size 65535
	}

	set rsync_conns6 {
		type ipv6_addr
		flags dynamic
		size 65535
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif lo accept

		# ICMPv6 不能一刀切：邻居发现和路径 MTU 都靠它，
		# 全丢会让 IPv6 时通时不通、大包卡死。
		ip6 nexthdr icmpv6 icmpv6 type {
			destination-unreachable, packet-too-big, time-exceeded,
			parameter-problem, echo-request, echo-reply,
			nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
		} accept

		ip protocol icmp icmp type {
			echo-request, echo-reply, destination-unreachable, time-exceeded
		} accept

		# 每个来源每分钟 10 个新连接，超过的丢掉；这个来源被限速不影响别人。
		tcp dport __SSH_PORT__ ct state new add @ssh_flood { ip saddr limit rate over 10/minute burst 5 packets } drop
		tcp dport __SSH_PORT__ ct state new add @ssh_flood6 { ip6 saddr limit rate over 10/minute burst 5 packets } drop
		tcp dport __SSH_PORT__ accept
		tcp dport { 80, 443 } accept

		# rsync 对下游镜像站开放。这里的上限要高于 rsyncd 的 max connections
		# （12），否则第 13 个客户端在这一层被丢包，只能等 TCP 超时，看不到
		# rsyncd 那句 max connections reached。这一条是滥用兜底，不是排队机制。
		tcp dport 873 add @rsync_conns { ip saddr ct count over 16 } drop
		tcp dport 873 add @rsync_conns6 { ip6 saddr ct count over 16 } drop
		tcp dport 873 accept

		# node_exporter，只对上面 monitor_hosts 集合里的监控机开放。
		tcp dport 9100 ip saddr @monitor_hosts accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
