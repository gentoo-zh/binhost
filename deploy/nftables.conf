#!/sbin/nft -f

flush ruleset

table inet filter {
	set monitor_hosts {
		type ipv4_addr
	}

	set ssh_flood {
		type ipv4_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}

	set ssh_flood6 {
		type ipv6_addr
		flags dynamic,timeout
		timeout 1m
		size 65535
	}

	set rsync_conns {
		type ipv4_addr
		flags dynamic
		size 65535
	}

	set rsync_conns6 {
		type ipv6_addr
		flags dynamic
		size 65535
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif lo accept

		ip6 nexthdr icmpv6 icmpv6 type {
			destination-unreachable, packet-too-big, time-exceeded,
			parameter-problem, echo-request, echo-reply,
			nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
		} accept

		ip protocol icmp icmp type {
			echo-request, echo-reply, destination-unreachable, time-exceeded
		} accept

		tcp dport __SSH_PORT__ ct state new add @ssh_flood { ip saddr limit rate over 10/minute burst 5 packets } drop
		tcp dport __SSH_PORT__ ct state new add @ssh_flood6 { ip6 saddr limit rate over 10/minute burst 5 packets } drop
		tcp dport __SSH_PORT__ accept
		tcp dport { 80, 443 } accept
		udp dport 443 accept

		tcp dport 873 add @rsync_conns { ip saddr ct count over 16 } drop
		tcp dport 873 add @rsync_conns6 { ip6 saddr ct count over 16 } drop
		tcp dport 873 accept

		tcp dport 9100 ip saddr @monitor_hosts accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
