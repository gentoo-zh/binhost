#!/sbin/nft -f
#
# 镜像机的防火墙。deploy/install.sh 装到 /etc/nftables.conf 并应用。
#
# OpenRC 的 nftables 服务从 /var/lib/nftables/rules-save 还原，那是运行时
# 状态不是配置：SAVE_ON_STOP=yes 会在停服务时用当前规则覆盖它。改规则要改
# 这份文件，应用之后 rc-service nftables save 存回去，否则重启就回到旧的。

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif lo accept

		# ICMPv6 不能一刀切：邻居发现和路径 MTU 都靠它，
		# 全丢会让 IPv6 时通时不通、大包卡死。
		ip6 nexthdr icmpv6 icmpv6 type {
			destination-unreachable, packet-too-big, time-exceeded,
			parameter-problem, echo-request, echo-reply,
			nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
		} accept

		ip protocol icmp icmp type {
			echo-request, echo-reply, destination-unreachable, time-exceeded
		} accept

		tcp dport 60001 ct state new limit rate 10/minute burst 5 packets accept
		tcp dport { 80, 443 } accept

		# rsync 对下游镜像站开放。这里的上限要高于 rsyncd 的 max connections
		# （12），否则第 13 个客户端在这一层被丢包，只能等 TCP 超时，看不到
		# rsyncd 那句 max connections reached。这一条是滥用兜底，不是排队机制。
		tcp dport 873 ct count over 32 drop
		tcp dport 873 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
