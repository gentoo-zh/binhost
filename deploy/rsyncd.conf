# mirrors.gentoozh.org 的 rsync 服务端。
#
# 公开只读，不设白名单：下游镜像站要能自己接上，逐个加 IP 没人维护得动。
#
# 这台是单核，rsync 建文件列表是 CPU 密集的，并发一高会拖垮同机的 nginx。
# 所以限并发，而不是限来源。

pid file = /run/rsyncd.pid
log file = /var/log/rsyncd.log
use chroot = yes
read only = yes
list = yes

# 单核。超出的连接会被拒，客户端重试即可，比拖垮整机好。
max connections = 12
timeout = 600

uid = nobody
gid = nobody

[gentoo-zh]
    path = /srv/pub
    comment = gentoo-zh overlay distfiles and binary packages
    exclude = lost+found
    # 客户端能要求服务端做的事情里，checksum 最费 CPU：它会把 33 GB 全读一遍
    # 算摘要。这台一个核，任何人都能用一条 rsync -c 把它压住。
    # 包名含版本与 build id、distfile 名含版本，内容不会变，按大小和时间判断足够。
    #
    # delete 和 write 类的选项在 read only 下本来就无效，一并拒掉是为了让
    # 误用的客户端立刻收到明确的拒绝，而不是安静地退化。
    refuse options = checksum delete delete-before delete-during delete-after delete-excluded
    # 这些格式已经压过了，再压一遍只是白烧 CPU
    dont compress = *.gpkg.tar *.tar.zst *.tar.xz *.tar.gz *.zst *.xz *.gz *.bz2 *.7z *.zip *.deb *.rpm *.AppImage
