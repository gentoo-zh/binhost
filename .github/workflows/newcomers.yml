name: newcomers

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  find:
    runs-on: ubuntu-latest
    container: gentoo/stage3@sha256:7453ebe0a87f90ab16beed03c7f579a3cbb9ba4985e8cc310086277329b2290c  # gentoo/stage3:amd64
    outputs:
      rows: ${{ steps.pick.outputs.rows }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch the overlay
        run: |
          mkdir -p /tmp/overlay
          wget -qO- https://github.com/gentoo-zh/overlay/archive/refs/heads/master.tar.gz |
            tar xz -C /tmp/overlay --strip-components=1

      - name: Pick the ones worth proposing
        id: pick
        run: |
          set -euo pipefail
          python3 build/check-versions.py --newcomers /tmp/overlay build/packages.txt > /tmp/new.txt
          total=$(find /tmp/overlay -mindepth 2 -maxdepth 2 -type d | wc -l)
          listed=$(grep -cvE '^\s*(#|$)' build/packages.txt)
          echo ">>> overlay ${total} 个目录，清单 ${listed} 个，候选 $(wc -l < /tmp/new.txt) 个"
          cat /tmp/new.txt

          : > /tmp/ok.txt
          cp build/packages.txt /tmp/packages.orig
          while read -r cp ver; do
            [ -n "${cp}" ] || continue
            cp /tmp/packages.orig build/packages.txt
            python3 build/add-package.py "${cp}" > /dev/null
            if python3 build/validate.py /tmp/overlay > /tmp/validate.log 2>&1; then
              printf '%s %s\n' "${cp}" "${ver}" >> /tmp/ok.txt
            else
              echo "  ${cp} 加入后 validate 未通过，不提出："
              grep -E 'packages\.txt' /tmp/validate.log | sed 's/^/    /' || true
            fi
          done < /tmp/new.txt
          cp /tmp/packages.orig build/packages.txt

          {
            echo "rows<<EOF"
            cat /tmp/ok.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  propose:
    needs: find
    if: needs.find.outputs.rows != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Open one pull request per package
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ needs.find.outputs.rows }}
        run: |
          set -euo pipefail
          git config user.name "Zakk"
          git config user.email "zakk@gentoozh.org"

          base=$(git rev-parse HEAD)
          : > /tmp/urls.txt

          mapfile -t rows <<< "${ROWS}"

          for row in "${rows[@]}"; do
            [ -n "${row}" ] || continue
            cp=${row%% *}
            ver=${row#* }
            branch="newcomer/${cp//\//-}"

            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "  ${cp} 已经有 ${branch}，跳过"
              continue
            fi

            git checkout -q -B "${branch}" "${base}"
            python3 build/add-package.py "${cp}"

            if git diff --quiet -- build/packages.txt; then
              echo "  ${cp} 清单没有变化，跳过"
              continue
            fi

            git commit -q -m "build: add ${cp}" -- build/packages.txt
            git push -q origin "${branch}"

            body=$(printf '%s\n' \
              "overlay 里的 \`${cp}\` ${ver} 有构建系统，可以在 amd64 上安装，但不在收录清单上。" \
              "" \
              "合并表示收录，下一轮构建会包含它。关闭本 PR 并保留远端分支可停止重复提案。" \
              "删除远端分支 \`${branch}\` 后，下一次检查会重新提出；确认长期不收录时，请将它和原因写入 \`build/excluded.txt\`。" \
              "" \
              "清单顺序不分大小写，这里只插一行，没有重排。自动化会在该提交上执行完整的 \`validate\` 工作流程。")
            if ! gh workflow run validate.yml --ref "${branch}"; then
              echo "  ${cp} 无法触发 validate，删除远端分支 ${branch}"
              git push -q origin --delete "${branch}" || true
              continue
            fi
            if ! gh pr create --base master --head "${branch}" \
                 --title "build: add ${cp}" --body "${body}" >> /tmp/urls.txt; then
              echo "  ${cp} PR 创建失败，删除远端分支 ${branch}"
              git push -q origin --delete "${branch}" || true
              continue
            fi
          done

          cat /tmp/urls.txt
          {
            echo "urls<<EOF"
            cat /tmp/urls.txt
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Post the links to Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          URLS: ${{ steps.prs.outputs.urls }}
        run: |
          [ -n "${TELEGRAM_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT:-}" ] || exit 0
          [ -n "${URLS:-}" ] || exit 0
          text=$(printf '%s\n%s' "overlay 有待审核的新包，合并表示收录，不收录请关闭 PR：" "${URLS}")
          curl -fsS --max-time 20 -o /dev/null \
            --data-urlencode "chat_id=${TELEGRAM_CHAT}" \
            --data-urlencode "text=${text}" \
            --config - <<EOF
          url = "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
          EOF
