name: validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  packages:
    runs-on: ubuntu-latest
    container: gentoo/stage3@sha256:7453ebe0a87f90ab16beed03c7f579a3cbb9ba4985e8cc310086277329b2290c  # gentoo/stage3:amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch the overlay
        run: |
          mkdir -p /tmp/overlay
          wget -qO- https://github.com/gentoo-zh/overlay/archive/refs/heads/master.tar.gz |
            tar xz -C /tmp/overlay --strip-components=1

      - name: Check packages.txt
        run: python3 build/validate.py /tmp/overlay

      - name: Version check handles every commit shape
        run: python3 tests/test-check-versions.py

      - name: bindist detection handles every RESTRICT shape
        run: python3 tests/test-validate.py /tmp/overlay

      - name: Staging filter keeps only what is ours
        run: python3 tests/test-stage-index.py

      - name: Published index satisfies its own runtime dependencies
        run: python3 tests/test-verify-deps.py

      - name: The base snapshot retains Portage matching metadata
        run: python3 tests/test-snapshot-vdb.py

      - name: The configured Gentoo binrepo index is captured intact
        run: python3 tests/test-snapshot-binrepo.py

      - name: A generation cannot mix indexes and snapshots
        run: python3 tests/test-generation.py

      - name: The private key stays outside untrusted build containers
        run: python3 tests/test-signing-boundary.py

      - name: Packages already signed by the current key stay unchanged
        run: python3 tests/test-sign-packages.py

      - name: Verified signatures persist without following cache symlinks
        run: python3 tests/test-persist-packages.py

      - name: Package list separates the two repositories
        run: python3 tests/test-gen-packages.py

      - name: Reaping orphans deletes the right file
        run: python3 tests/test-audit-distfiles.py

      - name: Failure classifier does not invent packages
        run: python3 tests/test-classify-failures.py

      - name: Adding a package to the list
        run: python3 tests/test-add-package.py

      - name: Removing a package from the list
        run: python3 tests/test-retire-package.py

      - name: Moving a package in the list
        run: python3 tests/test-move-package.py

      - name: Automated pull requests dispatch validation first
        run: python3 tests/test-workflow-dispatch.py

      - name: Version comparison fixture still matches portage
        run: python3 tests/test-vercmp-fixture.py

      - name: install.sh covers what the scripts reach for
        run: python3 tests/test-install-covers-refs.py

      - name: The signing fingerprint agrees everywhere
        run: python3 tests/test-fingerprint-consistent.py

      - name: Exclusion list is enforced
        run: |
          cp build/packages.txt /tmp/packages.txt.bak
          head -1 build/excluded.txt >/dev/null
          cp="$(grep -vE '^\s*(#|$)' build/excluded.txt | head -1 | awk '{print $1}')"
          echo "$cp" >> build/packages.txt
          if python3 build/validate.py /tmp/overlay 2>&1 | grep -q "两份清单互斥"; then
            :
          else
            echo "!! 同时出现在两份清单里却没报出互斥"; exit 1
          fi
          cp /tmp/packages.txt.bak build/packages.txt
          python3 build/validate.py /tmp/overlay

      - name: Check the list generator runs
        run: OUT=/tmp/packages.json python3 build/gen-packages.py /tmp/overlay

  commits:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Commit messages follow the convention
        run: |
          target="${{ github.event_name == 'pull_request' && github.base_ref || 'master' }}"
          base=$(git merge-base "origin/${target}" HEAD)
          python3 build/check-commits.py "${base}..HEAD"
      - name: The checker itself still holds
        run: python3 tests/test-check-commits.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compile
        run: python3 -m py_compile build/*.py deploy/*.py
      - name: Classifier against real log shapes
        run: |
          d=$(mktemp -d)
          cat > "$d/app-misc_a.log" <<'EOF'
          !!! All ebuilds that could satisfy "app-misc/a" have been masked.
          - app-misc/a-1.0::gentoo-zh (masked by: FSL-1.1-MIT license(s))
          EOF
          cat > "$d/app-misc_b.log" <<'EOF'
          The following USE changes are necessary to proceed:
          # required by app-misc/b-1.0::gentoo-zh
          >=dev-libs/foo-1.2 python
          EOF
          cat > "$d/app-misc_c.log" <<'EOF'
          configure: error: XML::Parser perl module is required for intltool
           * ERROR: app-misc/c-1.0::gentoo-zh failed (configure phase):
          EOF
          cat > "$d/app-misc_d.log" <<'EOF'
          - dev-java/oraclejdk-bin-21.0.1::gentoo-zh (masked by: Oracle-BCLA license(s))
           * ERROR: app-misc/d-1.0::gentoo-zh failed (compile phase):
          EOF
          out=$(python3 build/classify-failures.py "$d")
          echo "$out"
          echo "$out" | grep -q "许可证不允许再分发（1 个）" || { echo "!! 许可证未识别"; exit 1; }
          echo "$out" | grep -q "依赖需要调整 USE（1 个）"   || { echo "!! USE 未识别"; exit 1; }
          echo "$out" | grep -q "构建失败（2 个）"           || { echo "!! 构建失败未识别"; exit 1; }
          echo "$out" | grep -q "许可证不允许再分发（1 个）" || { echo "!! 依赖的许可证被算到本包头上"; exit 1; }
          echo "$out" | grep -q "未归类"                     && { echo "!! 出现未归类"; exit 1; }
          exit 0

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse the scripts
        run: |
          for f in site/assets/*.js; do node --check "$f" || exit 1; done
          echo "  $(ls site/assets/*.js | wc -l) 个脚本可解析"
      - name: The front-end scripts survive being loaded
        run: node tests/test-scripts-load.js site/assets

      - name: Check i18n tables
        run: node build/check-i18n.js site
      - name: Version order on the packages page
        run: node tests/test-vercmp.js
      - name: Shared chrome is up to date
        run: python3 build/render-chrome.py --check
      - name: Check nav and footer
        run: python3 build/check-chrome.py site
      - name: Search hint on the packages page
        run: node tests/test-packages-search.js
      - name: Build timing on the home page
        run: node tests/test-index-facts.js
      - name: Packages page failure state
        run: node tests/test-packages-error.js
      - name: File browser breadcrumbs
        run: node tests/test-app-crumbs.js
      - name: Links that differ per language
        run: node tests/test-i18n-engine.js
      - name: Mirror pickers agree
        run: python3 build/check-pickers.py
      - name: Both setup modes say the same thing
        run: python3 build/check-panes.py
      - name: Check copy
        run: python3 build/check-copy.py site
      - name: The copy checker still catches every shape
        run: python3 tests/test-check-copy.py
      - name: Check stylesheet
        run: python3 build/check-css.py site

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck
        run: shellcheck build/*.sh deploy/*.sh tests/*.sh deploy-site.sh

      - name: Alerting survives a broken alert.conf
        run: bash tests/test-alert.sh

      - name: Delete budgets, DONE markers and index consistency
        run: bash tests/test-shell-behaviour.sh

      - name: Publication alerts distinguish cleanup from transfer failures
        run: bash tests/test-cycle.sh

      - name: The same failure is not notified twice
        run: bash tests/test-status-dedup.sh

      - name: install.sh 送到远端的脚本能解析，防火墙有回滚
        run: bash tests/test-install-remote-script.sh

  nginx:
    runs-on: ubuntu-latest
    container: nginx@sha256:5a88c9c45479443d7be2eadc894b4ed0a9801bae03d97a5760ae13b5c2005942  # nginx:mainline
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse nginx config
        run: |
          apt-get update -qq && apt-get install -y -qq openssl curl
          mkdir -p /srv/mirrors /var/www/acme
          live=/etc/letsencrypt/live/distfiles.gentoozh.org
          mkdir -p $live
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=distfiles.gentoozh.org \
            -keyout $live/privkey.pem -out $live/fullchain.pem 2>/dev/null
          cp nginx/*.inc nginx/distfiles.conf /etc/nginx/conf.d/
          sed 's/mime\.types\.nginx/mime.types/' nginx/nginx.conf > /etc/nginx/nginx.conf
          nginx -t

      - name: Answer real requests
        run: |
          cp site/_app.html site/index.html site/faq.html /srv/mirrors/
          mkdir -p /srv/pub/binpkgs/x86-64 /srv/pub/distfiles
          printf 'PACKAGES: 1\n\nCPV: a/b-1\n' > /srv/pub/binpkgs/x86-64/Packages
          printf '[structure]\n0=filename-hash BLAKE2B 8\n' > /srv/pub/distfiles/layout.conf
          mkdir -p /srv/pub/distfiles/c6 && echo x > /srv/pub/distfiles/c6/t.tar.gz
          nginx
          sleep 1
          H='Host: distfiles.gentoozh.org'
          code() { curl -sS -o /dev/null -w '%{http_code}' -H "$H" "http://127.0.0.1$1"; }
          loc()  { curl -sS -o /dev/null -w '%{redirect_url}' -H "$H" "http://127.0.0.1$1"; }
          fail() { echo "!! $1"; exit 1; }

          [ "$(code /binpkgs/x86-64/nope.gpkg.tar)" = 404 ] || fail "不存在的包没有返回 404"
          [ "$(code /binpkgs/x86-64/Packages)" = 200 ]      || fail "索引无法获取"
          [ "$(code /distfiles/layout.conf)" = 200 ]        || fail "distfiles 无法获取"
          [ "$(code /distfiles/c6/t.tar.gz)" = 200 ]        || fail "distfiles 布局不对"
          [ "$(code /distfiles/distfiles/layout.conf)" = 404 ] || fail "distfiles 多了一层"

          hdr() { curl -sS -o /dev/null -D - -H "$H" "http://127.0.0.1$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2-; }
          [ "$(hdr /faq x-content-type-options)" = nosniff ] || fail "页面没有 nosniff"
          case "$(hdr /faq content-security-policy)" in "default-src 'self'"*) ;; *) fail "页面 CSP 不对" ;; esac
          case "$(hdr /distfiles/c6/t.tar.gz content-security-policy)" in "default-src 'none'; sandbox") ;; *) fail "distfile 未使用 sandbox 那一份" ;; esac
          case "$(hdr /distfiles/c6/ content-security-policy)" in "default-src 'self'"*) ;; *) fail "distfiles 目录页使用的不是站点那一份 CSP" ;; esac
          case "$(hdr /binpkgs/x86-64/ content-security-policy)" in "default-src 'self'"*) ;; *) fail "binpkgs 目录页使用的不是站点那一份 CSP" ;; esac
          [ "$(hdr /binpkgs/x86-64/Packages x-content-type-options)" = nosniff ] || fail "索引没有 nosniff"

          printf 'User-agent: *\nDisallow: /distfiles/\n' > /srv/mirrors/robots.txt
          [ "$(code /robots.txt)" = 200 ] || fail "robots.txt 无法获取"
          [ "$(code /favicon.ico)" = 301 ] || fail "favicon.ico 没有跳转"
          mkdir -p /srv/mirrors/assets && echo 'body{}' > /srv/mirrors/assets/t.css
          echo '{}' > /srv/mirrors/t.json
          case "$(hdr /assets/t.css cache-control)" in *immutable*) ;; *) fail "css 没有长缓存" ;; esac
          case "$(hdr /t.json cache-control)" in *no-cache*) ;; *) fail "json 不该长缓存" ;; esac
          [ "$(code /_raw/)" = 200 ] || fail "/_raw/ 目录浏览打不开"

          [ "$(code /binpkgs/x86-64/)" = 200 ] || fail "目录浏览打不开"
          [ "$(code /files/)" = 200 ]          || fail "浏览根打不开"

          [ "$(code /faq)" = 200 ]              || fail "/faq 打不开"
          [ "$(code /faq.html)" = 301 ]         || fail "/faq.html 没有跳转"
          case "$(loc /faq.html)" in *"/faq") ;; *) fail "/faq.html 跳到了 $(loc /faq.html)" ;; esac
          [ "$(code /index.html)" = 301 ]       || fail "/index.html 没有跳转"

          [ "$(code /gentoo-zh/binpkgs/x86-64/Packages)" = 301 ] || fail "旧路径没有跳转"

          [ "$(code /_app.html)" = 200 ] || fail "_app.html 被跳转了"
          [ "$(code /_app)" = 404 ]      || fail "/_app 不该可访问"

          [ "$(code /files/nope/)" = 404 ] || fail "/files/ 下的路径该是 404"

          curl -sS -I -H "$H" http://127.0.0.1/faq | grep -qi '^cache-control: no-cache' \
            || fail "页面没有发 Cache-Control"
          curl -sS -I -H "$H" http://127.0.0.1/faq | grep -qi '^strict-transport-security' \
            || fail "页面没有发 HSTS"

          echo "  全部通过"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Parse the firewall rules
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          sed 's/__SSH_PORT__/60001/g' deploy/nftables.conf > /tmp/nftables.real
          sudo nft -c -f /tmp/nftables.real
          echo "  nftables.conf 可解析"
          grep -q '__SSH_PORT__' deploy/nftables.conf ||
            { echo "!! 占位符不见了，install.sh 的 SSH_PORT 代换会失效"; exit 1; }

      - name: Parse logrotate
        run: |
          sudo apt-get install -y -qq logrotate
          sudo logrotate -d deploy/logrotate-binhost >/dev/null 2>&1 || {
            echo "!! logrotate-binhost 解析不过"
            sudo logrotate -d deploy/logrotate-binhost
            exit 1
          }
          echo "  logrotate-binhost 可解析"

      - name: Verify the systemd units
        run: |
          cp deploy/systemd/binhost-*.service deploy/systemd/binhost-*.timer /tmp/
          systemd-analyze verify /tmp/binhost-*.service /tmp/binhost-*.timer 2>&1 |
            grep -v "Command .* is not executable" | grep -v "^$" > /tmp/verify.txt || true
          if [ -s /tmp/verify.txt ]; then cat /tmp/verify.txt; exit 1; fi
          echo "  systemd 单元可解析"

      - name: Parse the cron table
        run: |
          awk 'NF && $1 !~ /^#/ {
                 if (NF < 7) { print "!! 字段不足： " $0; bad=1 }
               } END { exit bad }' deploy/cron.d-binhost
          echo "  cron.d-binhost 字段完整"
